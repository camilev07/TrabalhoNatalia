name: CI - Auditoria HTML
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
      - name: Checar arquivos estaticos
        run: |
          ls -R
          echo "Arquivos HTML:"
          find . -name "*.html" | wc -l
      - name: Validar sintaxe do HTML
        run: npx --yes htmlhint@1.9.2 "**/*.html"
