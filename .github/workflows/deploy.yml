name: Deploy do Trabalho Natalia
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar pacote dist
        run: |
          rm -rf dist
          mkdir -p dist
          cp ./*.html dist/
          cp -R assets dist/
          cp -R css dist/
          ls -R dist
      - name: Auditoria de Qualidade
        run: |
          for arquivo in index.html sobre.html contato.html; do
            test -f "dist/$arquivo" || { echo "Arquivo nao encontrado: dist/$arquivo"; exit 1; }
          done
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'
  publicar-site:
    needs: validacao
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
