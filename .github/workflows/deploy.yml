name: Deploy do Trabalho Natalia
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Falha proposital do desafio
        run: comando_que_nao_existe
      - name: Smoke test
        run: test -f index.html
      - name: Explorando o Runner
        run: lsb_release -a && free -h && nproc
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
  publicar-site:
    needs: validacao
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
